name: SynthAI deployment

# event
on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}

jobs:

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}

      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2



      - name: build Gateway
        run: |
          docker build \
          -f backend/gateway/Dockerfile \
          -t gateway backend

      - name: tag Gateway
        run: |
          docker tag gateway:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: push Gateway
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest



      - name: build Auth
        run: |
          docker build \
          -f backend/services/auth/Dockerfile \
          -t auth-service backend

      - name: tag Auth
        run: |
          docker tag auth-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: push Auth
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest



      - name: build Chat
        run: |
          docker build \
          -f backend/services/chat/Dockerfile \
          -t chat-service backend

      - name: tag Chat
        run: |
          docker tag chat-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: push Chat
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest



      - name: build Agent
        run: |
          docker build \
          -f backend/services/agent/Dockerfile \
          -t agent-service backend

      - name: tag Agent
        run: |
          docker tag agent-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: push Agent
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest



      - name: build Billing
        run: |
          docker build \
          -f backend/services/billing/Dockerfile \
          -t billing-service backend

      - name: tag Billing
        run: |
          docker tag billing-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: push Billing
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest






      - name: deploy Gateway
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.GATEWAY_SERVICE}} \
          --force-new-deployment


      - name: deploy Auth
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AUTH_SERVICE}} \
          --force-new-deployment


      - name: deploy Chat
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.CHAT_SERVICE}} \
          --force-new-deployment


      - name: deploy Agent
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AGENT_SERVICE}} \
          --force-new-deployment


      - name: deploy Billing
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.BILLING_SERVICE}} \
          --force-new-deployment



  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build frontend
        working-directory: ./frontend
        env:
          VITE_FIREBASE_API_KEY: ${{secrets.VITE_FIREBASE_API_KEY}}
          VITE_SERVER_URL: ${{secrets.VITE_SERVER_URL}}
          VITE_RAZORPAY_KEY_ID: ${{secrets.VITE_RAZORPAY_KEY_ID}}
        run: |
          npm install
          npm run build


      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}

      - name: upload to S3
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{secrets.S3_BUCKET_FRONTEND}} \
          --delete

      - name: invalidate Cloudfront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id \
          ${{secrets.CLOUDFRONT_DISTRIBUTION_ID}} \
          --paths "/*"